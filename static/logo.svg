<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFC"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B5FEF"/>
      <stop offset="100%" stop-color="#7C5CFC"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="circleClip">
      <circle cx="24" cy="24" r="18"/>
    </clipPath>
  </defs>
  <!-- Magnifying glass outer ring -->
  <circle cx="24" cy="24" r="20" fill="none" stroke="url(#lensGrad)" stroke-width="3.5" opacity="0.9"/>
  <!-- Inner lens glass -->
  <circle cx="24" cy="24" r="16.5" fill="#0D0F1A" opacity="0.95"/>
  <!-- Aperture blades (6-blade iris) -->
  <g clip-path="url(#circleClip)">
    <path d="M24 8 L28 20 L20 20 Z" fill="url(#lensGrad)" opacity="0.85" transform="rotate(0 24 24)"/>
    <path d="M24 8 L28 20 L20 20 Z" fill="url(#lensGrad)" opacity="0.85" transform="rotate(60 24 24)"/>
    <path d="M24 8 L28 20 L20 20 Z" fill="url(#lensGrad)" opacity="0.85" transform="rotate(120 24 24)"/>
    <path d="M24 8 L28 20 L20 20 Z" fill="url(#lensGrad)" opacity="0.85" transform="rotate(180 24 24)"/>
    <path d="M24 8 L28 20 L20 20 Z" fill="url(#lensGrad)" opacity="0.85" transform="rotate(240 24 24)"/>
    <path d="M24 8 L28 20 L20 20 Z" fill="url(#lensGrad)" opacity="0.85" transform="rotate(300 24 24)"/>
  </g>
  <!-- Center lens dot -->
  <circle cx="24" cy="24" r="5" fill="url(#lensGrad)" filter="url(#glow)"/>
  <circle cx="24" cy="24" r="2.5" fill="#ffffff" opacity="0.9"/>
  <!-- Lens reflection highlight -->
  <ellipse cx="18" cy="16" rx="4" ry="2.5" fill="white" opacity="0.15" transform="rotate(-30 18 16)"/>
  <!-- Magnifying glass handle -->
  <line x1="38" y1="38" x2="56" y2="58" stroke="url(#handleGrad)" stroke-width="6" stroke-linecap="round"/>
  <!-- Handle end cap -->
  <circle cx="56" cy="58" r="3" fill="#5B5FEF"/>
</svg>
