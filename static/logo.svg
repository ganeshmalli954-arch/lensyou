<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDEDED"/>
      <stop offset="50%" stop-color="#A1A1AA"/>
      <stop offset="100%" stop-color="#3F3F46"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4E4E7"/>
      <stop offset="100%" stop-color="#71717A"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#71717A"/>
      <stop offset="100%" stop-color="#27272A"/>
    </linearGradient>
    <clipPath id="apertureClip">
      <circle cx="24" cy="24" r="17"/>
    </clipPath>
  </defs>

  <!-- Magnifying glass / optics outer rim -->
  <circle cx="24" cy="24" r="20" fill="none" stroke="url(#rimGrad)" stroke-width="2.5" opacity="0.95"/>
  <circle cx="24" cy="24" r="18.5" fill="none" stroke="#27272A" stroke-width="0.75"/>

  <!-- Inner lens glass cavity -->
  <circle cx="24" cy="24" r="17" fill="#080808"/>

  <!-- 6-blade iris aperture -->
  <g clip-path="url(#apertureClip)">
    <path d="M24 7 L29 21 L19 21 Z" fill="url(#bladeGrad)" opacity="0.85" transform="rotate(0 24 24)"/>
    <path d="M24 7 L29 21 L19 21 Z" fill="url(#bladeGrad)" opacity="0.85" transform="rotate(60 24 24)"/>
    <path d="M24 7 L29 21 L19 21 Z" fill="url(#bladeGrad)" opacity="0.85" transform="rotate(120 24 24)"/>
    <path d="M24 7 L29 21 L19 21 Z" fill="url(#bladeGrad)" opacity="0.85" transform="rotate(180 24 24)"/>
    <path d="M24 7 L29 21 L19 21 Z" fill="url(#bladeGrad)" opacity="0.85" transform="rotate(240 24 24)"/>
    <path d="M24 7 L29 21 L19 21 Z" fill="url(#bladeGrad)" opacity="0.85" transform="rotate(300 24 24)"/>
  </g>

  <!-- Aperture center pupil -->
  <circle cx="24" cy="24" r="5" fill="#050505" stroke="#3F3F46" stroke-width="0.75"/>
  <!-- Precision optical focal point -->
  <circle cx="24" cy="24" r="1.8" fill="#F5F5F5"/>

  <!-- Subtle specular arc highlight -->
  <path d="M 11 20 A 15 15 0 0 1 20 11" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.25" stroke-linecap="round"/>

  <!-- Sleek graphite handle shaft -->
  <line x1="38" y1="38" x2="56" y2="56" stroke="url(#handleGrad)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="56" cy="56" r="2.5" fill="#52525B"/>
</svg>
