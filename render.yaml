services:
  - type: web
    name: lensyou
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OWNER_EMAIL
        value: ganeshmalli954@gmail.com
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_PATH
        value: /var/data/lensyou.db
    disk:
      name: lensyou-data
      mountPath: /var/data
      sizeGB: 1
